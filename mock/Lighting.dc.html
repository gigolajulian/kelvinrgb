<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap" rel="stylesheet">
<style>

<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0d0e0f; color: #e4e4e1; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px;">
<div style="flex: 1; display: flex; flex-wrap: wrap;">

<nav class="nav" aria-label="Pages" style="flex: 1 1 200px; max-width: 220px; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid #222528; display: flex; flex-direction: column; gap: 2px;">

<a href="Main.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M1 9h3l2-5 3 9 2-6 1 2h3"></path></svg>Monitoring</a>
<span style="flex: 1;"></span>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px;">

</div>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 16px;">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
<label style="display: flex; align-items: center; gap: 8px;"><span class="lbl">profile</span>
<select style="background: #121315; border: 1px solid #2c3034; border-radius: 4px; padding: 7px 10px; font-size: 13px;"><option>Default</option><option>Night</option></select></label>
<button type="button" style="padding: 7px 12px; border: 1px solid #2c3034; border-radius: 4px; background: transparent; font-size: 13px;">New profile</button>
<span style="flex: 1;"></span>
<div role="tablist" aria-label="Lighting view" style="display: flex; gap: 4px; padding: 4px; background: #121315; border-radius: 6px;">
<button type="button" role="tab" aria-selected="true" style="padding: 6px 14px; border: 0; border-radius: 4px; background: #24272a; font-size: 13px;">Effect</button>
<button type="button" role="tab" aria-selected="false" style="padding: 6px 14px; border: 0; border-radius: 4px; background: transparent; color: #8b9096; font-size: 13px;">Layout</button>
</div>
<button type="button" aria-label="Help" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid #2c3034; background: transparent; color: #8b9096; font-size: 12px;">?</button>
</header>

<div style="position: absolute; left: 6%; top: 14%; width: 30%; height: 56%; border: 1px solid #2c3034; border-radius: 4px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; box-sizing: border-box; background: #c8323c33;"><span class="lbl" style="color: #c9ccce;">motherboard</span></div>
<div style="position: absolute; left: 40%; top: 14%; width: 3%; height: 46%; border-radius: 2px; background: #c8323c;"></div>
<div style="position: absolute; left: 45%; top: 14%; width: 3%; height: 46%; border-radius: 2px; background: #c8323c;"></div>
<div style="position: absolute; left: 40%; top: 66%; width: 10%;"><span class="lbl">dram</span></div>
<div style="position: absolute; left: 6%; top: 78%; width: 44%; height: 10%; border-radius: 3px; background: #2a2c2f;"></div>

<div style="position: absolute; left: 76%; top: 8%; width: 9%; aspect-ratio: 1; border-radius: 50%; border: 5px solid #c8323c; box-sizing: border-box;"></div>
<div style="position: absolute; left: 76%; top: 40%; width: 9%; aspect-ratio: 1; border-radius: 50%; border: 5px solid #c8323c; box-sizing: border-box;"></div>
<div style="position: absolute; left: 88%; top: 40%; width: 9%; aspect-ratio: 1; border-radius: 50%; border: 5px solid #c8323c; box-sizing: border-box;"></div>
<div style="position: absolute; left: 76%; top: 76%;"><span class="lbl">case fans</span></div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px;">
<section aria-label="Effects" style="flex: 1 1 220px; background: #121315; border: 1px solid #222528; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
<span class="lbl" style="padding: 4px 8px 10px;">effects</span>
<button type="button" aria-pressed="true" style="display: flex; justify-content: space-between; padding: 10px; border: 0; border-radius: 6px; background: #1a1c1f; text-align: left;"><span>Static</span><span style="width: 8px; height: 8px; border-radius: 4px; background: #8fd3e0; align-self: center;"></span></button>
<button type="button" aria-pressed="false" style="display: flex; justify-content: space-between; padding: 10px; border: 0; border-radius: 6px; background: transparent; color: #8b9096; text-align: left;"><span>Breathing</span></button>
<button type="button" aria-pressed="false" style="display: flex; justify-content: space-between; padding: 10px; border: 0; border-radius: 6px; background: transparent; color: #8b9096; text-align: left;"><span>Spectrum cycle</span></button>
<button type="button" aria-pressed="false" style="display: flex; justify-content: space-between; padding: 10px; border: 0; border-radius: 6px; background: transparent; color: #8b9096; text-align: left;"><span>Wave</span><span class="lbl">later</span></button>
<button type="button" aria-pressed="false" style="display: flex; justify-content: space-between; padding: 10px; border: 0; border-radius: 6px; background: transparent; color: #8b9096; text-align: left;"><span>Off</span></button>
</section>

<section aria-label="Effect settings" style="flex: 999 1 420px; min-width: 0; background: #121315; border: 1px solid #222528; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span class="lbl">static · settings</span>
<label style="display: flex; align-items: center; gap: 8px;"><span class="lbl">preset</span><select style="background: #0d0e0f; border: 1px solid #2c3034; border-radius: 4px; padding: 6px 8px; font-size: 13px;"><option>Oxblood</option><option>Cold room</option><option>Save as new</option></select></label>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px;">
<div style="width: 180px; height: 120px; border-radius: 6px; background: linear-gradient(0deg, #000, transparent), linear-gradient(90deg, #fff, #ff0000); position: relative;"><span style="position: absolute; left: 78%; top: 24%; width: 12px; height: 12px; border-radius: 6px; border: 2px solid #fff; box-sizing: border-box;"></span></div>
<div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 12px; justify-content: center;">
<div style="height: 10px; border-radius: 5px; background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);"></div>
<div style="display: flex; gap: 6px;">
<button type="button" aria-label="Oxblood" style="width: 28px; height: 28px; border-radius: 4px; border: 1px solid #e4e4e1; background: #c8323c;"></button>
<button type="button" aria-label="Cyan" style="width: 28px; height: 28px; border-radius: 4px; border: 0; background: #2fb8cf;"></button>
<button type="button" aria-label="Amber" style="width: 28px; height: 28px; border-radius: 4px; border: 0; background: #e08a2c;"></button>
<button type="button" aria-label="Warm white" style="width: 28px; height: 28px; border-radius: 4px; border: 0; background: #f2efe8;"></button>
<button type="button" aria-label="Violet" style="width: 28px; height: 28px; border-radius: 4px; border: 0; background: #6a4cc8;"></button>
</div>
<label style="display: flex; align-items: center; gap: 8px;"><span class="lbl">hex</span><input type="text" value="#C8323C" class="num" style="width: 96px; background: #0d0e0f; border: 1px solid #2c3034; border-radius: 4px; color: #e4e4e1; padding: 5px 8px; font-size: 12px;"></label>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px;">
<label style="display: flex; flex-direction: column; gap: 8px;"><span style="display: flex; justify-content: space-between;"><span class="lbl">speed</span><span class="lbl num" style="color: #c9ccce;">40</span></span><input type="range" min="0" max="100" value="40"></label>
<label style="display: flex; flex-direction: column; gap: 8px;"><span style="display: flex; justify-content: space-between;"><span class="lbl">direction</span><span class="lbl" style="color: #c9ccce;">left to right</span></span><select style="background: #0d0e0f; border: 1px solid #2c3034; border-radius: 4px; padding: 6px 8px; font-size: 13px;"><option>Left to right</option><option>Right to left</option><option>Up</option><option>Down</option></select></label>
</div>
<label style="display: flex; align-items: center; gap: 10px;"><input type="checkbox" checked style="accent-color: #8fd3e0; width: 16px; height: 16px; margin: 0;"><span style="font-size: 13px; color: #c9ccce;">Apply to all devices</span></label>
</section>
</div>
</main>
</div>

<footer style="border-top: 1px solid #222528; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
<div style="display: flex; align-items: center; gap: 10px; min-width: 200px;">
<span style="width: 28px; height: 28px; border-radius: 4px; background: #c8323c;"></span>
<div style="display: flex; flex-direction: column;"><span style="font-size: 13px;">Static</span><span class="lbl">#c8323c · all devices</span></div>
</div>
<span style="flex: 1;"></span>
<button type="button" aria-label="Lights off" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #2c3034; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M7 1v5M3.5 3.5a5 5 0 1 0 7 0"></path></svg></button>
<span style="flex: 1;"></span>
<label style="display: flex; align-items: center; gap: 10px; width: 220px;"><span class="lbl">brightness</span><input type="range" min="0" max="100" value="80"><span class="lbl num" style="color: #c9ccce;">80</span></label>
</footer>
