<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0e0f}
a{color:#c9ccce;text-decoration:none}a:hover{color:#e4e4e1}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#8b9096}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;font-size:14px;color:#8b9096}
.nav a:hover{color:#e4e4e1;background:#16181a}
input[type=range]{width:100%;margin:0;accent-color:#8fd3e0}
button,select{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0d0e0f; color: #e4e4e1; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px;">
<div style="flex: 1; display: flex; flex-wrap: wrap;">

<nav class="nav" aria-label="Pages" style="flex: 1 1 200px; max-width: 220px; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid #222528; display: flex; flex-direction: column; gap: 2px;">
<span class="num" style="font-size: 13px; letter-spacing: 0.2em; padding: 0 12px 20px;">RGB</span>
<a href="Lighting.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="6.5" r="4"></circle><path d="M6 13h4M6.5 15h3"></path></svg>Lighting</a>
<a href="Devices.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="3" width="12" height="9" rx="1"></rect><path d="M5 14h6"></path></svg>Devices</a>
<a href="Cooling.dc.html" aria-current="page" style="color: #e4e4e1; background: #1a1c1f;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8fd3e0" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="1.5"></circle><path d="M8 6.5C8 3 10 2 11.5 3S10 6.5 8 6.5M9.5 8c3.5 0 4.5 2 3.5 3.5S9.5 10 9.5 8M8 9.5c0 3.5-2 4.5-3.5 3.5S6 9.5 8 9.5M6.5 8C3 8 2 6 3 4.5S6.5 6 6.5 8"></path></svg>Cooling</a>
<a href="Main.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M1 9h3l2-5 3 9 2-6 1 2h3"></path></svg>Monitoring</a>
<span style="flex: 1;"></span>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px;">
<div style="display: flex; justify-content: space-between;"><span class="lbl">openrgb</span><span class="lbl" style="color: #c9ccce;">ok</span></div>
<div style="display: flex; justify-content: space-between;"><span class="lbl">sensors</span><span class="lbl" style="color: #c9ccce;">ok</span></div>
<div style="display: flex; justify-content: space-between;"><span class="lbl">apex guard</span><span class="lbl" style="color: #c9ccce;">idle</span></div>
</div>
<a href="#settings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg>Settings</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 16px;">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
<label style="display: flex; align-items: center; gap: 8px;"><span class="lbl">profile</span>
<select style="background: #121315; border: 1px solid #2c3034; border-radius: 4px; padding: 7px 10px; font-size: 13px;"><option>Default</option><option>Silent edit</option></select></label>
<button type="button" style="padding: 7px 12px; border: 1px solid #2c3034; border-radius: 4px; background: transparent; font-size: 13px;">New profile</button>
<span style="flex: 1;"></span>
<span class="lbl">bios control returns if the app stops</span>
<button type="button" aria-label="Help" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid #2c3034; background: transparent; color: #8b9096; font-size: 12px;">?</button>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px;">
<button type="button" aria-pressed="true" style="background: #1a1c1f; border: 1px solid #8fd3e0; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left;">
<span style="display: flex; justify-content: space-between; width: 100%;"><span>CPU fan</span><span class="lbl">cpu_fan</span></span>
<span class="num" style="font-size: 22px;">1040<span style="font-size: 12px; color: #8b9096;"> rpm</span></span>
<span class="lbl">44% · curve · balanced</span>
</button>
<button type="button" aria-pressed="false" style="background: #121315; border: 1px solid #222528; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left;">
<span style="display: flex; justify-content: space-between; width: 100%;"><span>Pump</span><span class="lbl">aio_pump</span></span>
<span class="num" style="font-size: 22px;">2600<span style="font-size: 12px; color: #8b9096;"> rpm</span></span>
<span class="lbl">70% · fixed</span>
</button>
<button type="button" aria-pressed="false" style="background: #121315; border: 1px solid #222528; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left;">
<span style="display: flex; justify-content: space-between; width: 100%;"><span>Case front</span><span class="lbl">sys_fan1</span></span>
<span class="num" style="font-size: 22px;">820<span style="font-size: 12px; color: #8b9096;"> rpm</span></span>
<span class="lbl">38% · curve · quiet</span>
</button>
<button type="button" aria-pressed="false" style="background: #121315; border: 1px solid #222528; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left;">
<span style="display: flex; justify-content: space-between; width: 100%;"><span>Case rear</span><span class="lbl">sys_fan2</span></span>
<span class="num" style="font-size: 22px;">790<span style="font-size: 12px; color: #8b9096;"> rpm</span></span>
<span class="lbl">38% · curve · quiet</span>
</button>
<button type="button" aria-pressed="false" style="background: #121315; border: 1px solid #222528; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; color: #8b9096;">
<span style="display: flex; justify-content: space-between; width: 100%;"><span>GPU</span><span class="lbl">driver</span></span>
<span class="num" style="font-size: 22px;">0<span style="font-size: 12px;"> rpm</span></span>
<span class="lbl">bios / driver · read only</span>
</button>
</div>

<section aria-label="CPU fan curve" style="background: #121315; border: 1px solid #222528; border-radius: 8px; padding: 18px; display: flex; flex-wrap: wrap; gap: 24px;">
<div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
<span style="font-size: 16px;">CPU fan</span>
<span style="flex: 1;"></span>
<div role="group" aria-label="Curve shape" style="display: flex; gap: 4px; padding: 4px; background: #0d0e0f; border-radius: 6px;">
<button type="button" aria-pressed="true" style="padding: 6px 12px; border: 0; border-radius: 4px; background: #24272a; font-size: 13px;">Smooth</button>
<button type="button" aria-pressed="false" style="padding: 6px 12px; border: 0; border-radius: 4px; background: transparent; color: #8b9096; font-size: 13px;">Linear</button>
<button type="button" aria-pressed="false" style="padding: 6px 12px; border: 0; border-radius: 4px; background: transparent; color: #8b9096; font-size: 13px;">Stepped</button>
</div>
</div>
<svg viewBox="-36 -10 476 236" width="100%" role="img" aria-label="Fan curve: 25% at 30 °C, 35% at 50, 55% at 65, 85% at 80, 100% at 90. Now 58 °C, 46%." style="display: block;">
<g stroke="#1e2124" stroke-width="1">
<line x1="0" y1="0" x2="400" y2="0"></line><line x1="0" y1="50" x2="400" y2="50"></line><line x1="0" y1="100" x2="400" y2="100"></line><line x1="0" y1="150" x2="400" y2="150"></line><line x1="0" y1="200" x2="400" y2="200"></line>
<line x1="0" y1="0" x2="0" y2="200"></line><line x1="100" y1="0" x2="100" y2="200"></line><line x1="200" y1="0" x2="200" y2="200"></line><line x1="300" y1="0" x2="300" y2="200"></line><line x1="400" y1="0" x2="400" y2="200"></line>
</g>
<rect x="0" y="150" width="400" height="50" fill="#16181a"></rect>
<line x1="0" y1="150" x2="400" y2="150" stroke="#5c6166" stroke-dasharray="3 4"></line>
<text x="396" y="166" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="#8b9096">FLOOR 25% · STALL 18%</text>
<path d="M0 150 L50 150 C100 150 120 138 150 130 C185 120 200 105 225 90 C255 70 275 45 300 30 C320 18 335 4 350 0 L400 0" fill="none" stroke="#8fd3e0" stroke-width="2"></path>
<g fill="#0d0e0f" stroke="#8fd3e0" stroke-width="2">
<circle cx="50" cy="150" r="5"></circle><circle cx="150" cy="130" r="5"></circle><circle cx="225" cy="90" r="5"></circle><circle cx="300" cy="30" r="5"></circle><circle cx="350" cy="0" r="5"></circle>
</g>
<line x1="190" y1="0" x2="190" y2="200" stroke="#e4e4e1" stroke-width="1" opacity="0.35"></line>
<circle cx="190" cy="108" r="4" fill="#e4e4e1"></circle>
<text x="196" y="104" font-family="IBM Plex Mono, monospace" font-size="10" fill="#e4e4e1">58 °C · 46%</text>
<g font-family="IBM Plex Mono, monospace" font-size="9" fill="#8b9096">
<text x="0" y="216" text-anchor="middle">20</text><text x="100" y="216" text-anchor="middle">40</text><text x="200" y="216" text-anchor="middle">60</text><text x="300" y="216" text-anchor="middle">80</text><text x="400" y="216" text-anchor="middle">100 °C</text>
<text x="-8" y="3" text-anchor="end">100</text><text x="-8" y="103" text-anchor="end">50</text><text x="-8" y="203" text-anchor="end">0%</text>
</g>
</svg>
<span class="lbl">click to add a point · drag to move · ctrl+z to undo</span>
</div>

<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 16px;">
<div role="group" aria-label="Control mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #0d0e0f; border-radius: 6px;">
<button type="button" aria-pressed="true" style="padding: 7px 0; border: 0; border-radius: 4px; background: #24272a; font-size: 13px;">Curve</button>
<button type="button" aria-pressed="false" style="padding: 7px 0; border: 0; border-radius: 4px; background: transparent; color: #8b9096; font-size: 13px;">Fixed</button>
<button type="button" aria-pressed="false" style="padding: 7px 0; border: 0; border-radius: 4px; background: transparent; color: #8b9096; font-size: 13px;">BIOS</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px;"><span class="lbl">follows sensor</span>
<select style="background: #0d0e0f; border: 1px solid #2c3034; border-radius: 4px; padding: 8px; font-size: 13px;"><option>CPU package</option><option>GPU edge</option><option>Max of CPU, GPU</option><option>Liquid temp</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span class="lbl">preset</span>
<select style="background: #0d0e0f; border: 1px solid #2c3034; border-radius: 4px; padding: 8px; font-size: 13px;"><option>Balanced</option><option>Quiet</option><option>Performance</option><option>New custom curve</option></select></label>
<div style="padding: 12px; border: 1px solid #2c3034; border-radius: 6px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between;"><span class="lbl">calibration</span><span class="lbl" style="color: #c9ccce;">done</span></div>
<div style="display: flex; justify-content: space-between;"><span style="font-size: 13px; color: #c9ccce;">Starts at</span><span class="num" style="font-size: 13px;">22% · 410 rpm</span></div>
<div style="display: flex; justify-content: space-between;"><span style="font-size: 13px; color: #c9ccce;">Stalls below</span><span class="num" style="font-size: 13px;">18%</span></div>
<div style="display: flex; justify-content: space-between;"><span style="font-size: 13px; color: #c9ccce;">Max</span><span class="num" style="font-size: 13px;">2100 rpm</span></div>
<button type="button" style="padding: 7px 0; border: 1px solid #2c3034; border-radius: 4px; background: transparent; font-size: 13px;">Recalibrate</button>
</div>
<span style="flex: 1;"></span>
<button type="button" style="padding: 10px 0; border: 1px solid #8fd3e0; border-radius: 4px; background: #8fd3e0; color: #0d0e0f; font-size: 13px;">Apply</button>
</div>
</section>
</main>
</div>

<footer style="border-top: 1px solid #222528; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
<div style="display: flex; align-items: center; gap: 10px; min-width: 200px;">
<span style="width: 28px; height: 28px; border-radius: 4px; background: #c8323c;"></span>
<div style="display: flex; flex-direction: column;"><span style="font-size: 13px;">Static</span><span class="lbl">#c8323c · all devices</span></div>
</div>
<span style="flex: 1;"></span>
<button type="button" aria-label="Lights off" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #2c3034; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M7 1v5M3.5 3.5a5 5 0 1 0 7 0"></path></svg></button>
<span style="flex: 1;"></span>
<label style="display: flex; align-items: center; gap: 10px; width: 220px;"><span class="lbl">brightness</span><input type="range" min="0" max="100" value="80"><span class="lbl num" style="color: #c9ccce;">80</span></label>
</footer>
</div>
</x-dc>
