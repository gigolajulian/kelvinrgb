<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>KelvinRGB</title>
<style>
/* Splash D: a glass tile. The logo's own ring fills as start-up steps finish (splash.js), the steps tick off below.
   Approved mock: mock/splash/index.html.
   The window is transparent and click-through; main.js calls step(i, secs) and done(). */
@font-face{font-family:'IBM Plex Mono';src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2');font-weight:500 700}
:root{--ink:#e6e7e8;--soft:#9aa0a6;--dim:#6c7177;--acc:#8fd3e0;--ok:#7fd49b;--warn:#f0a35e;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);
  --mono:'IBM Plex Mono','Cascadia Mono',Consolas,monospace;--sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--ink)}
body{display:grid;place-items:center}
.d{width:320px;padding:30px 26px 18px;border-radius:22px;background:rgba(17,19,22,.94);border:1px solid var(--line2);box-sizing:border-box;
  opacity:0;transform:scale(.96);animation:in .5s cubic-bezier(.2,.8,.2,1) forwards}
.d.done{animation:out .38s cubic-bezier(.4,0,.2,1) forwards}
.logo{display:block;margin:0 auto}
.d.full .logo{animation:beat .55s cubic-bezier(.34,1.56,.64,1)}
.track{stroke:rgba(255,255,255,.07);transition:stroke .4s}
.d.full .track{stroke:rgba(255,255,255,.02)}
h1{margin:16px 0 14px;text-align:center;font:600 17px var(--sans)}
ul{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line)}
li{display:flex;align-items:center;gap:10px;height:26px;font:12px var(--mono);color:var(--dim);transition:color .3s}
li span:last-child{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
li.run{color:var(--ink)}
li.ok{color:var(--soft)}
li.ok span:first-of-type{animation:nudge .4s cubic-bezier(.34,1.56,.64,1)}
/* the mark: an empty ring, a spinning accent arc while running, a green disc with a drawn tick when done */
.m{width:14px;height:14px;flex:none;overflow:visible}
.m .o{fill:none;stroke:var(--line2);stroke-width:1.2;transition:stroke .25s}
.m .f{fill:var(--ok);transform-origin:7px 7px;transform:scale(0);transition:transform .32s cubic-bezier(.34,1.56,.64,1)}
.m .s{fill:none;stroke:var(--acc);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:11 40;transform-origin:7px 7px;opacity:0;transition:opacity .2s}
.m .t{fill:none;stroke:#0e1a12;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9;stroke-dashoffset:9;transition:stroke-dashoffset .22s ease-out .1s}
.m .x{stroke:var(--warn);stroke-width:1.6;stroke-linecap:round;opacity:0;transition:opacity .25s}
li.run .o{stroke:rgba(143,211,224,.18)}
li.run .s{opacity:1;animation:spin .8s linear infinite}
li.ok .o{stroke:var(--ok)}
li.ok .f{transform:scale(1)}
li.ok .t{stroke-dashoffset:0}
li.skip .o{stroke:var(--warn)}
li.skip .x{opacity:1}
li.skip span:last-child{color:var(--warn)}
.credit{margin-top:14px;text-align:center;font:10px var(--mono);letter-spacing:.04em;color:var(--dim)}
@keyframes in{to{opacity:1;transform:none}}
@keyframes out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6px) scale(.985)}}
@keyframes beat{40%{transform:scale(1.045)}100%{transform:none}}
@keyframes nudge{40%{transform:translateX(2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="d" id="d">
  <svg class="logo" viewBox="0 0 256 256" width="112" height="112" aria-hidden="true">
    <defs>
      <linearGradient id="kg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff8a3d"/><stop offset=".5" stop-color="#fff4e6"/><stop offset="1" stop-color="#8fd3e0"/></linearGradient>
      <linearGradient id="kb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2e33"/><stop offset="1" stop-color="#0a0b0c"/></linearGradient>
      <linearGradient id="ks" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <clipPath id="kc"><path d="M128 8C30 8 8 30 8 128s22 120 120 120 120-22 120-120S226 8 128 8Z"/></clipPath>
    </defs>
    <g clip-path="url(#kc)">
      <rect width="256" height="256" fill="url(#kb)"/>
      <circle class="track" cx="128" cy="128" r="62" fill="none" stroke-width="28"/>
      <circle id="prog" cx="128" cy="128" r="62" fill="none" stroke="url(#kg)" stroke-width="28" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="390" transform="rotate(-90 128 128)"/>
      <rect width="256" height="128" fill="url(#ks)"/>
    </g>
  </svg>
  <h1>KelvinRGB</h1>
  <ul id="steps">
    <li><svg class="m" viewBox="0 0 14 14"><circle class="o" cx="7" cy="7" r="6.2"/><circle class="f" cx="7" cy="7" r="6.6"/><circle class="s" cx="7" cy="7" r="6.2"/><path class="t" d="M4.1 7.3l2 2 3.8-4.3"/><path class="x" d="M4.5 7h5"/></svg><span>Game check</span><span></span></li>
    <li><svg class="m" viewBox="0 0 14 14"><circle class="o" cx="7" cy="7" r="6.2"/><circle class="f" cx="7" cy="7" r="6.6"/><circle class="s" cx="7" cy="7" r="6.2"/><path class="t" d="M4.1 7.3l2 2 3.8-4.3"/><path class="x" d="M4.5 7h5"/></svg><span>OpenRGB</span><span></span></li>
    <li><svg class="m" viewBox="0 0 14 14"><circle class="o" cx="7" cy="7" r="6.2"/><circle class="f" cx="7" cy="7" r="6.6"/><circle class="s" cx="7" cy="7" r="6.2"/><path class="t" d="M4.1 7.3l2 2 3.8-4.3"/><path class="x" d="M4.5 7h5"/></svg><span>Lighting</span><span></span></li>
    <li><svg class="m" viewBox="0 0 14 14"><circle class="o" cx="7" cy="7" r="6.2"/><circle class="f" cx="7" cy="7" r="6.6"/><circle class="s" cx="7" cy="7" r="6.2"/><path class="t" d="M4.1 7.3l2 2 3.8-4.3"/><path class="x" d="M4.5 7h5"/></svg><span>Sensors</span><span></span></li>
  </ul>
  <div class="credit">Made by Julian · Powered by OpenRGB</div>
</div>
<script src="splash.js"></script>
</body>
</html>
